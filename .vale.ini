#
# Prose linting for the manuscripts. Vale is markup-aware, so it lints prose and leaves code
# blocks alone — which matters here, because the manuscripts are roughly a third code.
#
# Run:  vale books/<slug>/source/*.md      (or: scripts/verify-book.sh <slug> --prose)
#
# Deliberately NOT ASD-STE100 conformance. See docs/maintainers/prose-style.md for why: STE
# is a controlled language for aircraft maintenance procedures read by non-native speakers,
# and its ~900-word approved dictionary and short-sentence rules would flatten expository
# writing aimed at senior engineers. The transferable parts of STE — sentence length, active
# voice, one idea per sentence, no synonym drift — are implemented below as house rules.
StylesPath = styles
MinAlertLevel = suggestion
Vocab = Handbooks

# Everything here is local: no `Packages` line, so `vale sync` and network access are not
# required and CI cannot break because an upstream style changed. To add the Microsoft or
# Google styles later, see docs/maintainers/prose-style.md — introduce them one rule at a
# time, or an existing 8,000-line manuscript will produce thousands of alerts at once.

[*.md]
BasedOnStyles = Handbooks

# The manuscripts embed raw LaTeX (\Needspace{4\baselineskip}, \usepackage, tcolorbox
# environments). That is markup, not prose, and must not be linted as sentences.
TokenIgnores = (\\[A-Za-z]+(\{[^}]*\})?), (\$[^\n$]+\$)

# Procedural content — runbooks, incident steps, release sequences — gets the stricter
# STE-derived caps. The Procedures style lives in its own directory precisely so that the base
# `Handbooks` style cannot pull it in: Vale applies every rule in a style directory, so a
# 20-word cap kept alongside the house rules would fire on all expository prose (measured: 247
# false positives on one manuscript).
[books/*/source/procedures/**]
BasedOnStyles = Handbooks, Procedures
Handbooks.SentenceLength = NO

# Promoted draft material (books/*/source/raw/) and drafts/ are unedited by definition and are
# never linted. Vale 3 has no per-path "disable" switch, so exclusion is done by glob in
# scripts/lint-prose.sh, which is the supported entrypoint. Running bare `vale` over the whole
# repo will lint raw material; use the script.
