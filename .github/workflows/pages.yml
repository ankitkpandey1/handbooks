#
# Publishes the site to GitHub Pages: the human catalogue (docs/ — books.json, llms.txt,
# sitemap.xml, robots.txt) plus a rendered, SEO-tagged HTML page for every published book,
# so a book is readable directly on the site and not only as a release-asset download.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "books.json"
      - "books/*/book.json"
      - "books/*/source/**"
      - "scripts/build-index.py"
      - "scripts/build-site.sh"
      - "scripts/build-book.sh"
      - "scripts/site_inject.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # No LaTeX needed: the site only ever builds the html (and, via build-index.py,
      # no format at all) — never pdf, which is the only format that needs xelatex.
      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc

      # Build from source rather than trusting the committed copy, so the site can never
      # drift from the books' own metadata.
      - name: Regenerate catalogue
        run: python3 scripts/build-index.py

      - name: Fail if the committed catalogue was stale
        run: |
          if ! git diff --quiet -- books.json docs/; then
            echo "::warning::committed catalogue was stale; deploying the freshly generated one."
            echo "Run 'python3 scripts/build-index.py' and commit to silence this."
          fi

      # Stages docs/ plus a rendered books/<slug>/index.html per published book into _site/.
      # _site/ is never committed (see .gitignore); it is rebuilt fresh on every deploy.
      - name: Build site (catalogue + rendered books)
        run: bash scripts/build-site.sh _site

      # enablement: true turns Pages on if it is not already, so a fresh clone of this
      # repository does not need a manual Settings visit before the first deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
